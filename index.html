    // --- UTILITIES ---
    function calculateDistanceMeters(coord1, coord2) {
      const R = 6371e3;
      const φ1 = (coord1.lat * Math.PI) / 180;
      const φ2 = (coord2.lat * Math.PI) / 180;
      const Δφ = ((coord2.lat - coord1.lat) * Math.PI) / 180;
      const Δλ = ((coord2.lng - coord1.lng) * Math.PI) / 180;
      const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return Math.round(R * c);
    }

    function calculateWalkingMinutes(meters) {
      return Math.max(1, Math.round(meters / 80));
    }

    function rankVenues(venues, request) {
      const userLoc = request.userLocation || CAMPUS_CENTER;

      const results = venues.map((venue) => {
        const distanceMeters = calculateDistanceMeters(userLoc, venue.coordinates);
        const walkingMinutes = calculateWalkingMinutes(distanceMeters);

        // Capacity Fit
        let capacityScore = 0;
        if (venue.capacity < request.attendance) {
          capacityScore = Math.max(0, Math.round((venue.capacity / request.attendance) * 35));
        } else {
          const ratio = request.attendance / venue.capacity;
          if (ratio >= 0.7 && ratio <= 0.95) capacityScore = 100;
          else if (ratio > 0.95) capacityScore = 90;
          else if (ratio >= 0.4) capacityScore = Math.round(75 + ratio * 20);
          else capacityScore = Math.max(30, Math.round(ratio * 150));
        }

        // Facilities Match
        let facilityScore = 100;
        const missing = [];
        if (request.requiredFacilities && request.requiredFacilities.length > 0) {
          const matched = request.requiredFacilities.filter(rf => venue.facilities.includes(rf));
          facilityScore = Math.round((matched.length / request.requiredFacilities.length) * 100);
          request.requiredFacilities.forEach(rf => {
            if (!venue.facilities.includes(rf)) missing.push(rf);
          });
        }

        // Availability
        let availabilityScore = venue.status === 'available' ? 100 : venue.status === 'pending' ? 65 : 20;

        // Proximity
        const proximityScore = Math.max(40, Math.min(100, Math.round(100 - (distanceMeters / 1000) * 50)));

        // Historical
        const historicalScore = (venue.historicalSuitability && venue.historicalSuitability[request.eventType]) || 75;

        // Reliability
        const reliabilityScore = Math.max(50, Math.round(100 - venue.cancellationRate * 5));

        let weighted = capacityScore * 0.25 + facilityScore * 0.25 + availabilityScore * 0.20 + historicalScore * 0.15 + proximityScore * 0.10 + reliabilityScore * 0.05;

        if (venue.capacity < request.attendance) weighted = Math.min(weighted, 54);
        if (venue.status === 'booked') weighted = Math.min(weighted, 48);

        const matchScore = Math.max(18, Math.min(99, Math.round(weighted)));

        const whyRecommended = [
          `Capacity fits your event (${request.attendance} requested in ${venue.capacity}-seat hall)`,
          `All essential requested facilities verified in venue specifications`,
          `Venue is available during your requested schedule window`,
          `Past ${request.eventType} organizers gave ${historicalScore}% suitability score`,
          `Consistently low cancellation rate (${venue.cancellationRate}%)`,
          `Short walking distance (${distanceMeters}m, ~${walkingMinutes} min walk)`
        ];
        if (venue.wheelchairAccessible) {
          whyRecommended.push('Wheelchair ramp and elevator accessibility verified');
        }
        whyRecommended.push(`Energy efficiency certified (Class ${venue.energyRating})`);

        return {
          venue,
          matchScore,
          capacityScore,
          facilityScore,
          availabilityScore,
          historicalScore,
          proximityScore,
          reliabilityScore,
          distanceMeters,
          walkingMinutes,
          whyRecommended,
          warnings: missing.length > 0 ? [`Missing requested facilities: ${missing.join(', ')}`] : []
        };
      });

      results.sort((a, b) => b.matchScore - a.matchScore);
      results.forEach((r, idx) => r.rank = idx + 1);
      return results;
    }

    function generateCampusWalkingRoute(start, destination) {
      const destCoords = destination.coordinates;
      const midLat = (start.lat + destCoords.lat) / 2;
      const midLng = (start.lng + destCoords.lng) / 2;

      const waypoints = [
        [start.lat, start.lng],
        [start.lat + (destCoords.lat - start.lat) * 0.35 + 0.0002, start.lng + (destCoords.lng - start.lng) * 0.25],
        [midLat, midLng + 0.0003],
        [start.lat + (destCoords.lat - start.lat) * 0.75, destCoords.lng - 0.0002],
        [destCoords.lat, destCoords.lng]
      ];

      const distanceMeters = Math.round(calculateDistanceMeters(start, destCoords) * 1.18);
      const totalWalkingMinutes = calculateWalkingMinutes(distanceMeters);

      const steps = [
        { instruction: `Head straight along Central Campus Boulevard towards ${destination.building}`, distanceMeters: Math.round(distanceMeters * 0.35), durationMinutes: Math.max(1, Math.round(totalWalkingMinutes * 0.35)) },
        { instruction: `Turn towards the shaded pedestrian walkway past the Central Library plaza`, distanceMeters: Math.round(distanceMeters * 0.4), durationMinutes: Math.max(1, Math.round(totalWalkingMinutes * 0.4)) },
        { instruction: `Enter ${destination.building} main portico and proceed to ${destination.floor}`, distanceMeters: Math.round(distanceMeters * 0.25), durationMinutes: Math.max(1, Math.round(totalWalkingMinutes * 0.25)) }
      ];

      return { destination, distanceMeters, totalWalkingMinutes, waypoints, steps };
    }

    function generateQRCodeSVG(data, size = 200) {
      const matrixSize = 25;
      const grid = Array.from({ length: matrixSize }, () => Array(matrixSize).fill(false));

      const drawFinder = (r0, c0) => {
        for (let r = 0; r < 7; r++) {
          for (let c = 0; c < 7; c++) {
            if (r === 0 || r === 6 || c === 0 || c === 6 || (r >= 2 && r <= 4 && c >= 2 && c <= 4)) {
              grid[r0 + r][c0 + c] = true;
            }
          }
        }
      };

      drawFinder(0, 0);
      drawFinder(0, matrixSize - 7);
      drawFinder(matrixSize - 7, 0);

      for (let i = 8; i < matrixSize - 8; i++) {
        grid[6][i] = i % 2 === 0;
        grid[i][6] = i % 2 === 0;
      }

      let hash = 0;
      for (let i = 0; i < data.length; i++) {
        hash = (hash << 5) - hash + data.charCodeAt(i);
        hash |= 0;
      }

      for (let r = 0; r < matrixSize; r++) {
        for (let c = 0; c < matrixSize; c++) {
          const inTL = r <= 7 && c <= 7;
          const inTR = r <= 7 && c >= matrixSize - 8;
          const inBL = r >= matrixSize - 8 && c <= 7;
          const inT = r === 6 || c === 6;
          if (!inTL && !inTR && !inBL && !inT) {
            const bit = Math.abs(Math.sin(hash + r * 17 + c * 31) * 10000) % 1;
            grid[r][c] = bit > 0.48;
          }
        }
      }

      const cellSize = size / matrixSize;
      let rects = '';
      for (let r = 0; r < matrixSize; r++) {
        for (let c = 0; c < matrixSize; c++) {
          if (grid[r][c]) {
            rects += `<rect x="${(c * cellSize).toFixed(2)}" y="${(r * cellSize).toFixed(2)}" width="${(cellSize + 0.2).toFixed(2)}" height="${(cellSize + 0.2).toFixed(2)}" fill="#0f172a" rx="1.5" />`;
          }
        }
      }

      return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" class="rounded-xl shadow-inner bg-white p-2.5"><rect width="${size}" height="${size}" fill="#ffffff" rx="12" />${rects}</svg>`;
    }

              <div className="absolute inset-y-0 right-0 max-w-md w-full bg-[#0b1329] border-l border-slate-800 p-6 flex flex-col justify-between text-white shadow-2xl">
                <div>
                  <div className="flex items-center justify-between pb-4 border-b border-slate-800 mb-4">
                    <h3 className="text-base font-bold">Campus Notifications</h3>
                    <button onClick={() => setIsNotificationsOpen(false)}>✕</button>
                  </div>
                  <div className="space-y-3">
                    {notifications.map(n => (
                      <div key={n.id} className="p-3 rounded-xl bg-slate-900 border border-slate-800 text-xs">
                        <div className="flex justify-between font-bold text-white mb-1"><span>{n.title}</span><span className="text-slate-500 text-[10px]">{n.timestamp}</span></div>
                        <p className="text-slate-300">{n.message}</p>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<CampusSpaceApp />, document.getElementById('root'));
  </script>
</body>
</html>
